name: Release BlueK desktop apps

on:
  push:
    tags:
      - "bluek-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows (x64) installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "bluek-v$version") { throw "Tag must match app version bluek-v$version" }
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build unsigned Windows installers
        run: npm run desktop:windows
      - name: Name Windows installers by platform
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi")
          $exe = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($msi.Count -ne 1) { throw "Expected one MSI, found $($msi.Count)" }
          if ($exe.Count -ne 1) { throw "Expected one NSIS installer, found $($exe.Count)" }
          Rename-Item -LiteralPath $msi[0].FullName -NewName "BlueK_${version}_Windows_x64.msi"
          Rename-Item -LiteralPath $exe[0].FullName -NewName "BlueK_${version}_Windows_x64_Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueK-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/BlueK_*_Windows_x64_Setup.exe
            src-tauri/target/release/bundle/msi/BlueK_*_Windows_x64.msi
          if-no-files-found: error

  release:
    name: Build macOS (Apple Silicon) app and publish release
    needs: windows
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag and signing credentials
        id: release-metadata
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          expected_tag="bluek-v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME must match the app version ($expected_tag)." >&2
            exit 1
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Import macOS Developer ID certificate
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/bluek-signing.p12"
          keychain="$RUNNER_TEMP/bluek-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
      - name: Build signed and notarized DMG
        run: npm run desktop:mac
      - name: Notarize and staple the DMG
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          dmg_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          dmg="$dmg_dir/BlueK_${version}_aarch64.dmg"
          codesign --verify --deep --strict --verbose=2 src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BlueK.app
          xcrun notarytool submit "$dmg" --wait --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          mv "$dmg" "$dmg_dir/BlueK_${version}_macOS_AppleSilicon.dmg"
      - uses: actions/download-artifact@v4
        with:
          name: BlueK-Windows-x64
          path: release/windows
      - uses: softprops/action-gh-release@v2
        with:
          name: BlueK ${{ steps.release-metadata.outputs.version }}
          body: |
            Desktop installers:

            - macOS (Apple silicon, macOS 12 or later): signed and notarized DMG.
            - Windows (x64): unsigned EXE and MSI installers; SmartScreen may show a warning.
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/BlueK_*_macOS_AppleSilicon.dmg
            release/windows/**/*.exe
            release/windows/**/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
