name: Deploy BlueK beta to own server

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluek-beta-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
      VITE_BLUEK_API_URL: https://api-beta.bluek.online

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build beta application
        run: npm run build

      - name: Test account API and database migration
        run: npm run test:publication-policy && npm run test:share-server && npm run test:database-backup

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BLUEK_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BLUEK_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/bluek_deploy
          chmod 600 ~/.ssh/bluek_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy isolated beta API
        env:
          HOST: ${{ secrets.BLUEK_DEPLOY_HOST }}
          USER: ${{ secrets.BLUEK_DEPLOY_USER }}
          PORT: ${{ secrets.BLUEK_DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/bluek_deploy -p "$PORT" "$USER@$HOST" \
            'install -d -o bluek-beta-share -g bluek-beta-share /opt/bluek-beta-share/server /opt/bluek-beta-share/data /opt/bluek-beta-share/backups'
          rsync -az \
            -e "ssh -i ~/.ssh/bluek_deploy -p $PORT" \
            --exclude=/data/ server/ "$USER@$HOST:/opt/bluek-beta-share/server/"
          rsync -az \
            -e "ssh -i ~/.ssh/bluek_deploy -p $PORT" \
            package.json package-lock.json "$USER@$HOST:/opt/bluek-beta-share/"
          ssh -i ~/.ssh/bluek_deploy -p "$PORT" "$USER@$HOST" "bash -s" <<'REMOTE'
          set -eu
          cd /opt/bluek-beta-share
          test -f /etc/bluek-beta/api.env
          grep -Fxq 'BLUEK_SHARE_PORT=8788' /etc/bluek-beta/api.env
          grep -Fxq 'BLUEK_SHARE_DB=/opt/bluek-beta-share/data/projects.sqlite' /etc/bluek-beta/api.env
          grep -Fxq 'BLUEK_API_ORIGINS=https://beta.bluek.online' /etc/bluek-beta/api.env
          grep -Fxq 'BLUEK_FEEDBACK_ORIGINS=https://beta.bluek.online' /etc/bluek-beta/api.env
          grep -Fxq 'BLUEK_FEEDBACK_TOKEN_FILE=/etc/bluek/feedback-token' /etc/bluek-beta/api.env
          test -s /etc/bluek/feedback-token
          npm ci --omit=dev
          chown -R bluek-beta-share:bluek-beta-share /opt/bluek-beta-share
          install -d -o bluek-beta-share -g bluek-beta-share -m 700 /opt/bluek-beta-share/backups
          DB_PATH=/opt/bluek-beta-share/data/projects.sqlite
          if test -f "$DB_PATH"; then
            node server/backup-database.mjs "$DB_PATH" /opt/bluek-beta-share/backups
          fi
          systemctl restart bluek-beta-share
          REMOTE

      - name: Confirm isolated beta API is healthy
        env:
          HOST: ${{ secrets.BLUEK_DEPLOY_HOST }}
          USER: ${{ secrets.BLUEK_DEPLOY_USER }}
          PORT: ${{ secrets.BLUEK_DEPLOY_PORT }}
        run: ssh -i ~/.ssh/bluek_deploy -p "$PORT" "$USER@$HOST" 'curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8788/api/health'

      - name: Deploy beta static files
        env:
          HOST: ${{ secrets.BLUEK_DEPLOY_HOST }}
          USER: ${{ secrets.BLUEK_DEPLOY_USER }}
          PORT: ${{ secrets.BLUEK_DEPLOY_PORT }}
          TARGET: ${{ secrets.BLUEK_BETA_DEPLOY_PATH }}
        run: |
          test -n "$TARGET"
          test "${TARGET%/}" = "/root/bluek-beta"
          ssh -i ~/.ssh/bluek_deploy -p "$PORT" "$USER@$HOST" "install -d '$TARGET'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/bluek_deploy -p $PORT" \
            frontend/dist/ \
            "$USER@$HOST:$TARGET/"
