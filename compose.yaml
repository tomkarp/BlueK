services:
  bluek:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: production
      PORT: "5173"
      GRADLE_USER_HOME: /var/cache/bluek/gradle
    volumes:
      - bluek-gradle-cache:/var/cache/bluek/gradle
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    tmpfs:
      - /tmp:size=2g

volumes:
  bluek-gradle-cache:
